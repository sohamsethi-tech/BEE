# Render Blueprint — https://dashboard.render.com
# New Web Service → Connect repo → Blueprint uses this file

services:
  - type: web
    name: pothole-backend-2
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: potholescan-db
          property: connectionString

databases:
  - name: potholescan-db
    region: oregon
    plan: free
    databaseName: potholescan
    user: potholescan
