server.port=8080

# MySQL by default. H2 fallback: SPRING_PROFILES_ACTIVE=local
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

app.jwt.secret=PotholeScan-Change-This-Secret-In-Production-Min32Chars!
app.jwt.expiration-ms=86400000

logging.level.com.pothole=INFO
logging.level.org.springframework.security=WARN
